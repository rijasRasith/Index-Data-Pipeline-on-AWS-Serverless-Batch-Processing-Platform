[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "index-pipeline"
version = "1.0.0"
description = "Serverless batch processing platform for equity index data on AWS"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "click>=8.1.7",
    "tabulate>=0.9.0",
    "requests>=2.31.0",
    "pandas>=2.1.5",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.3",
    "httpx>=0.26.0",
    "moto[s3]>=5.0.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "faker>=22.5.0",
]

[project.scripts]
index-cli = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["core*", "api*", "cli*", "lambda_validator*", "glue_job*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no cloud access)",
    "integration: Integration tests (requires local PostgreSQL)",
    "contract: Contract tests (schema and API validation)",
]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["core", "api", "cli", "lambda_validator", "glue_job"]
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
